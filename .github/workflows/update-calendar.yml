name: Update calendar feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the Google calendar (Six Blades Events)
        env:
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: |
          if [ -z "$GCAL_ICS_URL" ]; then echo "GCAL_ICS_URL secret is empty"; exit 1; fi
          curl -fsSL --max-time 60 "$GCAL_ICS_URL" -o events.new.ics
          grep -q 'BEGIN:VCALENDAR' events.new.ics || { echo "Not a calendar file"; exit 1; }
          COUNT=$(grep -c 'BEGIN:VEVENT' events.new.ics)
          if [ "$COUNT" -lt 1 ]; then echo "Feed has no events, keeping the previous copy"; exit 1; fi
          mv events.new.ics events.ics
          echo "Events in feed: $COUNT"

      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@github.com"
          git add events.ics
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update events.ics"
          git push
