<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, initial-scale=1"/>
<title>Six Blades - Events</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f2ede6;--panel:#ede7de;--border:#c9b8a0;--accent-red:#8b3320;--accent-green:#4a7020;--accent-purple:#5a3e9a;--text-main:#1c1008;--text-mid:#5a4030;--text-dim:#9a8070;--cell-day:#faf6f0;--cell-empty:#eae3d8;--grid-line:rgba(139,94,60,0.18);--header-bg:#1c1008;--header-text:#f2ede6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text-main);font-family:'Barlow',sans-serif;width:1920px;height:1080px;overflow:hidden;display:flex;flex-direction:column;}
header{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:136px;background:var(--header-bg);flex-shrink:0;position:relative;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--accent-red);}
.logo-img{height:72px;width:auto;object-fit:contain;}
.header-center{position:absolute;left:50%;transform:translateX(-50%);text-align:center;}
.month-label{font-family:'Bebas Neue',sans-serif;font-size:96px;color:var(--header-text);letter-spacing:8px;line-height:1;}
.year-label{font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:8px;color:var(--accent-red);text-transform:uppercase;}
.header-right{text-align:right;}
.clock{font-family:'Bebas Neue',sans-serif;font-size:76px;color:var(--header-text);letter-spacing:4px;line-height:1;}
.date-today{font-family:'Barlow Condensed',sans-serif;font-size:20px;color:rgba(242,237,230,0.5);letter-spacing:3px;text-transform:uppercase;}
.main{display:flex;flex:1;overflow:hidden;}
.calendar-area{flex:1;display:flex;flex-direction:column;}
.day-headers{display:grid;grid-template-columns:repeat(7,1fr);background:var(--accent-red);flex-shrink:0;}
.day-header{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,0.92);text-align:center;padding:16px 0 14px;text-transform:uppercase;border-right:1px solid rgba(255,255,255,0.1);}
.day-header:last-child{border-right:none;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));flex:1;border-top:1px solid var(--grid-line);border-left:1px solid var(--grid-line);}
.cell{border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);padding:12px 14px 10px;background:var(--cell-day);display:flex;flex-direction:column;gap:4px;overflow:visible;}
.cell.empty{background:var(--cell-empty);}
.cell.today{background:#fff8f2;box-shadow:inset 3px 0 0 var(--accent-red);}
.cell.today .day-num{color:var(--accent-red);}
.day-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text-mid);line-height:1;flex-shrink:0;}
.event-pill{border-radius:3px;padding:4px 9px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;line-height:1.25;text-transform:uppercase;flex-shrink:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.green{background:#dff0c8;color:#2d5010;border-left:3px solid #4a7020;}
.red{background:#fde8e4;color:#6b1a0a;border-left:3px solid #8b3320;}
.purple{background:#ede8f8;color:#3a2070;border-left:3px solid #5a3e9a;}
.sidebar{width:348px;flex-shrink:0;border-left:2px solid var(--border);display:flex;flex-direction:column;background:var(--panel);}
.sidebar-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:5px;color:var(--accent-red);text-transform:uppercase;padding:15px 22px 11px;border-bottom:1px solid var(--border);background:var(--bg);}
.upcoming-list{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.upcoming-item{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;animation:fadeUp 0.3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.udate{flex-shrink:0;width:48px;text-align:center;background:var(--accent-red);border-radius:4px;padding:5px 4px;}
.udate .ud{font-family:'Bebas Neue',sans-serif;font-size:34px;color:#fff;line-height:1;}
.udate .um{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,0.75);text-transform:uppercase;}
.uinfo{display:flex;flex-direction:column;gap:3px;}
.uname{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--text-main);line-height:1.15;text-transform:uppercase;}
.udays{font-family:'Barlow',sans-serif;font-size:15px;color:var(--text-dim);}
.sidebar-footer{padding:11px 20px;border-top:2px solid var(--border);display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;background:var(--bg);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#4a7020;flex-shrink:0;animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.65);}}
.legend{display:flex;gap:24px;align-items:center;padding:0 20px;height:32px;flex-shrink:0;border-top:1px solid var(--border);background:var(--panel);}
.legend-item{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.ldot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.bottom-bar{height:34px;background:var(--header-bg);display:flex;align-items:center;justify-content:center;gap:48px;flex-shrink:0;}
.bottom-bar span{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:3px;color:rgba(242,237,230,0.6);text-transform:uppercase;}
.sep{color:rgba(242,237,230,0.2)!important;letter-spacing:0!important;}
#syncStatus{position:fixed;top:8px;right:8px;padding:5px 12px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;z-index:99;display:none;}
#syncStatus.ok{background:#4a7020;color:#fff;}
#syncStatus.err{background:#8b3320;color:#fff;}
</style>
</head>

function pickColor(raw){
  if(/^\[P\]/i.test(raw)) return "purple";
  if(/^\[S\]/i.test(raw)) return "red";
  if(/^\[G\]/i.test(raw)) return "green";
  var t = raw.toLowerCase();
  if(/grading|graduation|belt|promo|exam|competition|tournament|lake day/.test(t)) return "purple";
  if(/seminar|master class|camp|leadership|meeting|special|guest|game night/.test(t)) return "red";
  return "green";
}

function cleanTitle(raw){ return raw.replace(/^\[(G|S|P)\]\s*/i, ""); }

function parseDate(str){
  var d = str.replace(/\D/g,"");
  return new Date(parseInt(d.slice(0,4)), parseInt(d.slice(4,6))-1, parseInt(d.slice(6,8)));
}

function parseUntil(str){
  str = str.trim();
  var d = str.replace(/\D/g,"");
  if(str.indexOf("T") !== -1 && str.indexOf("Z") !== -1){
    // Parse as true UTC, then convert to LOCAL date
    // e.g. 20260613T055959Z = June 13 05:59 UTC = June 12 23:59 MDT (Denver)
    // getFullYear/Month/Date on a Date object returns LOCAL time values
    var utc = new Date(Date.UTC(
      parseInt(d.slice(0,4)),
      parseInt(d.slice(4,6)) - 1,
      parseInt(d.slice(6,8)),
      parseInt(d.slice(8,10)  || "0"),
      parseInt(d.slice(10,12) || "0"),
      parseInt(d.slice(12,14) || "0")
    ));
    // Return midnight of the LOCAL calendar date this UTC moment falls on
    return new Date(utc.getFullYear(), utc.getMonth(), utc.getDate());
  }
  var yr = parseInt(d.slice(0,4));
  var mo = parseInt(d.slice(4,6)) - 1;
  var dy = parseInt(d.slice(6,8));
  return new Date(yr, mo, dy);
}

function expandRRULE(dtstart, rrule, title, windowStart, windowEnd){
  var events = [];
  var freq    = (rrule.match(/FREQ=([^;\r\n]+)/) || [])[1] || "";
  var interval= parseInt((rrule.match(/INTERVAL=(\d+)/) || [])[1] || "1");
  var countM  = rrule.match(/COUNT=(\d+)/);
  var untilM  = rrule.match(/UNTIL=([^;\r\n]+)/);
  var bydayM  = rrule.match(/BYDAY=([^;\r\n]+)/);
  var maxCount= countM ? parseInt(countM[1]) : 500;
  var until   = untilM ? parseUntil(untilM[1]) : windowEnd;
  var dayMap  = {SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  var bydays  = bydayM ? bydayM[1].split(",").map(function(d){ return dayMap[d.replace(/[^A-Z]/g,"")]; }) : null;

  var cur = new Date(dtstart);
  var added = 0; // only count actually added occurrences

  while(cur <= until && cur <= windowEnd && added < maxCount){
    var matches = !bydays || bydays.indexOf(cur.getDay()) !== -1;
    if(matches){
      if(cur >= windowStart && cur <= windowEnd){
        events.push({ date: new Date(cur), title: title });
      }
      added++; // count only real occurrences
    }
    // Advance cursor
    if(freq === "DAILY"){
      cur.setDate(cur.getDate() + interval);
    } else if(freq === "WEEKLY"){
      if(bydays && bydays.length > 1){
        cur.setDate(cur.getDate() + 1);
      } else {
        cur.setDate(cur.getDate() + 7 * interval);
      }
    } else if(freq === "MONTHLY"){
      cur.setMonth(cur.getMonth() + interval);
    } else if(freq === "YEARLY"){
      cur.setFullYear(cur.getFullYear() + interval);
    } else { break; }
  }
  return events;
}

function parseICS(text){
  text = text.replace(/\r\n[ \t]/g,"").replace(/\n[ \t]/g,"");
  var events = [];
  var now = new Date();
  var windowStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  var windowEnd   = new Date(now.getFullYear(), now.getMonth() + 3, 0);

  var blocks = text.split("BEGIN:VEVENT");
  for(var i = 1; i < blocks.length; i++){
    var b = blocks[i];
    var summaryMatch = b.match(/SUMMARY:([^\r\n]+)/);
    if(!summaryMatch) continue;
    var summary = summaryMatch[1].trim().replace(/\\n/g," ").replace(/\\,/g,",");

    var dtMatch  = b.match(/DTSTART[^:]*:([^\r\n]+)/);
    if(!dtMatch) continue;
    var dtstart = parseDate(dtMatch[1]);
    if(isNaN(dtstart.getTime())) continue;

    // DTEND — to detect & expand multi-day all-day events
    var dtendMatch = b.match(/DTEND[^:]*:([^\r\n]+)/);
    var dtend = dtendMatch ? parseDate(dtendMatch[1]) : null;

    // Excluded dates
    var exdates = [];
    var exMatch = b.match(/EXDATE[^:]*:([^\r\n]+)/g);
    if(exMatch) exMatch.forEach(function(ex){
      ex.split(":")[1].split(",").forEach(function(d){ exdates.push(parseDate(d).toDateString()); });
    });

    var rruleMatch = b.match(/RRULE:([^\r\n]+)/);
    if(rruleMatch){
      // Recurring event
      var expanded = expandRRULE(dtstart, rruleMatch[1], summary, windowStart, windowEnd);
      expanded.forEach(function(ev){
        if(exdates.indexOf(ev.date.toDateString()) === -1) events.push(ev);
      });
    } else if(dtend && dtend > dtstart){
      // Multi-day all-day event: expand to every day (DTEND is exclusive)
      // e.g. DTSTART Jun 15 + DTEND Jun 20 = shows Jun 15,16,17,18,19
      var cur = new Date(dtstart);
      while(cur < dtend){
        if(exdates.indexOf(cur.toDateString()) === -1){
          events.push({ date: new Date(cur), title: summary });
        }
        cur.setDate(cur.getDate() + 1);
      }
    } else {
      // Single event
      if(exdates.indexOf(dtstart.toDateString()) === -1){
        events.push({ date: dtstart, title: summary });
      }
    }
  }
  return events;
}

function renderCalendar(){
  var now = new Date();
  var nextMonth = now.getMonth() + 1;
  var year  = nextMonth > 11 ? now.getFullYear() + 1 : now.getFullYear();
  var month = nextMonth > 11 ? 0 : nextMonth;
  document.getElementById("monthLabel").textContent = MONTHS[month].toUpperCase();
  document.getElementById("yearLabel").textContent  = year;
  var firstDay = new Date(year,month,1).getDay();
  var daysInMonth = new Date(year,month+1,0).getDate();
  var today = now.getDate();
  var grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  for(var i=0; i<42; i++){
    var dayNum = i - firstDay + 1;
    var cell = document.createElement("div");
    cell.className = "cell";
    if(dayNum < 1 || dayNum > daysInMonth){
      cell.classList.add("empty");
    } else {
      // no today highlight on next month
      var numEl = document.createElement("div");
      numEl.className = "day-num";
      numEl.textContent = dayNum;
      cell.appendChild(numEl);
      for(var j=0; j<allEvents.length; j++){
        var ev = allEvents[j];
        if(ev.date.getFullYear()===year && ev.date.getMonth()===month && ev.date.getDate()===dayNum){
          var p = document.createElement("div");
          p.className = "event-pill " + pickColor(ev.title);
          p.textContent = cleanTitle(ev.title);
          cell.appendChild(p);
        }
      }
    }
    grid.appendChild(cell);
  }
  renderSidebar();
}

function renderSidebar(){
  var now = new Date(); now.setHours(0,0,0,0);
  var future = allEvents.filter(function(ev){ return ev.date >= now; });
  future.sort(function(a,b){ return a.date - b.date; });
  future = future.slice(0,9);
  var list = document.getElementById("upcomingList");
  list.innerHTML = "";
  if(!future.length){
    var empty = document.createElement("div");
    empty.style.cssText = "padding:20px;color:var(--text-dim);font-family:Barlow Condensed,sans-serif;font-size:14px;letter-spacing:2px;";
    empty.textContent = "NO UPCOMING EVENTS";
    list.appendChild(empty);
    return;
  }
  for(var i=0; i<future.length; i++){
    var ev = future[i];
    var diff = Math.round((ev.date - now) / 86400000);
    var item = document.createElement("div");
    item.className = "upcoming-item";
    item.style.animationDelay = (i * 0.05) + "s";
    var dbox = document.createElement("div"); dbox.className = "udate";
    var ud = document.createElement("div"); ud.className = "ud"; ud.textContent = ev.date.getDate();
    var um = document.createElement("div"); um.className = "um"; um.textContent = MONTHS_S[ev.date.getMonth()];
    dbox.appendChild(ud); dbox.appendChild(um);
    var info = document.createElement("div"); info.className = "uinfo";
    var uname = document.createElement("div"); uname.className = "uname"; uname.textContent = cleanTitle(ev.title);
    var udays = document.createElement("div"); udays.className = "udays";
    udays.textContent = diff===0 ? "Today!" : diff===1 ? "Tomorrow" : "In " + diff + " days";
    info.appendChild(uname); info.appendChild(udays);
    item.appendChild(dbox); item.appendChild(info);
    list.appendChild(item);
  }
}

function showStatus(msg, type){
  var el = document.getElementById("syncStatus");
  el.textContent = msg; el.className = type; el.style.display = "block";
  setTimeout(function(){ el.style.display = "none"; }, 5000);
}

var proxyIndex = 0;

function fetchAndRender(){
  tryProxy(0);
}

function tryProxy(idx){
  if(idx >= PROXIES.length){
    showStatus("Sync error - retrying soon", "err");
    if(allEvents.length === 0) renderCalendar();
    return;
  }
  var url = PROXIES[idx](ICS_URL);
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 8000;
  xhr.onload = function(){
    if(xhr.status === 200 && xhr.responseText.indexOf("BEGIN:VCALENDAR") !== -1){
      allEvents = parseICS(xhr.responseText);
      renderCalendar();
      var t = new Date();
      document.getElementById("syncLabel").textContent = "Synced " + pad(t.getHours()) + ":" + pad(t.getMinutes());
      showStatus("Synced " + allEvents.length + " events", "ok");
    } else {
      console.warn("Proxy " + idx + " bad response, trying next");
      tryProxy(idx + 1);
    }
  };
  xhr.onerror = function(){ console.warn("Proxy " + idx + " failed, trying next"); tryProxy(idx + 1); };
  xhr.ontimeout = function(){ console.warn("Proxy " + idx + " timeout, trying next"); tryProxy(idx + 1); };
  xhr.send();
}

fetchAndRender();
setInterval(fetchAndRender, REFRESH);
setInterval(function(){
  var n = new Date();
  if(n.getHours()===0 && n.getMinutes()===0 && n.getSeconds()<5) fetchAndRender();
}, 5000);
